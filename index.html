<style>

.tile span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}

.hc.n{border:0;background:none}
.sb{display:flex;height:14px;border:1px solid var(--ln);margin:10px 0 8px}.sb i{display:block}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.seg.cu i{opacity:0}
#wb b{font:400 56px "Permanent Marker","Segoe Print",cursive;color:var(--tx);margin-top:-4px;animation:rise .8s var(--ease) .45s both}
h2:before{content:"[ "}h2:after{content:" ]"}
.grp,.sheet,.add{--k:var(--tx);background-image:linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k)),linear-gradient(var(--k),var(--k));background-repeat:no-repeat;background-size:10px 2px,2px 10px,10px 2px,2px 10px,10px 2px,2px 10px,10px 2px,2px 10px;background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%}
.add{--k:var(--c)}

</style>

<body>

<nav id="nav"></nav>
<main><div id="v"></div></main>
<div id="md"></div>
<script>
const $=s=>document.querySelector(s),K='pt.v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={entries:[],lastBackup:0,hideBk:0,name:'Om'};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const ms=n=>n===10||n===50||(n>=100&&n%100===0);
function tick(){const t=pushed().length;if(t>(S.lt||0)&&ms(t))celebrate(t);S.lt=t}
const save=()=>{tick();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const ic=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const T={resistance:['R','Resistance'],failure:['F','Failure'],restart:['S','Restart']};
const scr0=[['home','Home','<path d="M3 11l9-8 9 8M5 10v11h14V10"/>'],['notes','Notes','<path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/>'],['jar','Jar','<path d="M8 3h8v3H8zM6 6h12v15H6zM6 11h12"/>'],['history','History','<path d="M3 3h18v18H3zM12 7v5l4 2"/>'],['stats','Stats','<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'],['settings','Settings','<path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4h4v6h-4zM6 14h4v6H6z"/>']];
let scr='home',per='total',nt='failure',nq='',nf='',nto='',shown=0,msg='',off=0,sr=30,sf='',st='',hm=0;
const PL={total:'all time',today:'today',weekly:'this week',monthly:'this month'};
function from(p){const d=new Date();d.setHours(0,0,0,0);if(p==='today')return+d;if(p==='weekly'){d.setDate(d.getDate()-((d.getDay()+6)%7));return+d}if(p==='monthly'){d.setDate(1);return+d}return 0}
const fmt=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ofT=t=>S.entries.filter(e=>e.type===t);
const pushed=()=>S.entries.filter(e=>e.type==='restart'||(e.type==='resistance'&&e.status==='through')).map(e=>e.type==='restart'?e.ts:e.doneTs||e.ts);
function fmtD(t){return new Date(t).toLocaleDateString([],{day:'numeric',month:'short'})}
function rng(p,o=off){const d=new Date();d.setHours(0,0,0,0);
 if(p==='today'){d.setDate(d.getDate()+o);const a=+d;return[a,a+864e5,o===0?'today':o===-1?'yesterday':d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})]}
 if(p==='weekly'){d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);const a=+d,e=new Date(a);e.setDate(e.getDate()+7);return[a,+e,o===0?'this week':o===-1?'last week':fmtD(a)+' - '+fmtD(+e-864e5)]}
 if(p==='monthly'){d.setDate(1);d.setMonth(d.getMonth()+o);const a=+d,e=new Date(d);e.setMonth(e.getMonth()+1);return[a,+e,o===0?'this month':d.toLocaleDateString([],{month:'long',year:'numeric'})]}
 return[0,Infinity,'all time']}
const cnt=(a,p)=>{const r=rng(p);return a.filter(t=>t>=r[0]&&t<r[1]).length};
const sub=t=>cnt(ofT(t).map(e=>e.ts),per);
const inJar=e=>e.jar||(e.type==='resistance'&&e.status==='through');
const byNew=a=>a.slice().sort((x,y)=>y.ts-x.ts);
const dg=v=>String(v).split('').map(c=>`<span>${c}</span>`).join('');
const tag=e=>`<span class="tag ${T[e.type][0]}">${T[e.type][1]}</span>`;
const age=e=>{const d=Math.floor((Date.now()-e.ts)/864e5);return d<1?'open today':`open for ${d} day${d>1?'s':''}`};
function celebrate(n){const d=document.createElement('div');d.id='ms';d.innerHTML=`<i></i><b>${n}</b><span>pushed through</span>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function pop(html,c=''){const m=$('#md');m.innerHTML=`<div class="ov"><div class="sheet ${c}">${html}</div></div>`;const ov=m.firstChild,close=()=>{ov.classList.add('x');setTimeout(()=>{if(m.firstChild===ov)m.innerHTML=''},230)};ov.onclick=e=>{if(e.target===ov)close()};return{ov,close,q:s=>ov.querySelector(s)}}
function toast(t,undo){clearTimeout(toast.t);const o=$('#tt');if(o)o.remove();const d=document.createElement('div');d.id='tt';d.innerHTML=`<span>${t}</span><button>Undo</button>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>{undo();d.remove()};toast.t=setTimeout(()=>d.remove(),5000)}
function del(id,both){const snap=JSON.stringify(S.entries);S.entries=S.entries.filter(x=>x.id!==id&&!(both&&x.fromFailure===id));save();render();toast('Deleted',()=>{S.entries=JSON.parse(snap);save();render()})}
function askDel(id){const e=S.entries.find(x=>x.id===id);
 if(e.type==='failure'&&S.entries.some(x=>x.fromFailure===id)){
  const p=pop(`<h4 style="color:var(--rd)">Delete failure</h4><p class="sub">Closing it created a restart that counts toward Pushed Through. Remove that too?</p><div class="act"><button class="btn c" style="--c:var(--rd)" id="d1">Delete both</button><button class="btn" id="d2">Keep the restart</button><button class="btn" id="d3">Cancel</button></div>`);
  p.q('#d1').onclick=()=>{p.close();del(id,true)};p.q('#d2').onclick=()=>{p.close();del(id,false)};p.q('#d3').onclick=p.close;
 }else del(id,false)}
function reopen(id){const snap=JSON.stringify(S.entries),e=S.entries.find(x=>x.id===id);e.status='open';delete e.closeNote;delete e.closeType;delete e.closedTs;S.entries=S.entries.filter(x=>x.fromFailure!==id);save();render();toast('Failure reopened',()=>{S.entries=JSON.parse(snap);save();render()})}
function edit(id){const e=S.entries.find(x=>x.id===id),cl=e.closeNote!==undefined,dt=new Date(e.ts-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 const p=pop(`<h4>Edit ${T[e.type][1]}</h4><p class="sub">Change the note or when it happened.</p><textarea id="e1" maxlength="1000">${esc(e.note)}</textarea>${cl?`<p class="sub" style="margin:12px 0 6px">Closing note</p><textarea id="e2" maxlength="1000">${esc(e.closeNote)}</textarea>`:''}<p class="sub" style="margin:12px 0 6px">When</p><div class="flt"><input id="e3" type="datetime-local" value="${dt}"></div><div class="err" id="er"></div><div class="act" style="margin-top:0"><button class="btn p" id="ok">Save</button><button class="btn" id="no">Cancel</button></div>`,T[e.type][0]);
 p.q('#no').onclick=p.close;
 p.q('#ok').onclick=()=>{const a=p.q('#e1').value.trim(),b=cl?p.q('#e2').value.trim():'x',t=+new Date(p.q('#e3').value);if(!a||!b){p.q('#er').textContent='Notes cannot be empty.';return}e.note=a;if(!isNaN(t))e.ts=t;if(cl){e.closeNote=b;S.entries.forEach(x=>{if(x.fromFailure===id)x.note=b})}p.close();save();render()}}
function cookie(){const l=S.entries.filter(inJar);if(!l.length)return;const p=pop(''),s=p.ov.firstChild;
 const show=()=>{const e=l[Math.floor(Math.random()*l.length)];s.innerHTML=`<h4 style="color:var(--tx)">From your jar</h4>${card(e,'',1)}<div class="act"><button class="btn p" id="c1">Another</button><button class="btn" id="c2">Close</button></div>`;s.querySelector('#c1').onclick=show;s.querySelector('#c2').onclick=p.close};show()}
function wipe(){const n=S.entries.length;
 if(!n){msg='Nothing to delete.';render();return}
 let p=pop(`<h4 style="color:var(--rd)">Delete everything?</h4><p class="sub">This removes all ${n} entries, including your cookie jar. There is no undo.</p><div class="act"><button class="btn" id="w0">Export first</button><button class="btn c" style="--c:var(--rd)" id="w1">Continue</button><button class="btn" id="wx">Cancel</button></div>`);
 p.q('#wx').onclick=p.close;p.q('#w0').onclick=exportFile;p.q('#w1').onclick=()=>{p.close();setTimeout(step2,260)};
 function step2(){p=pop(`<h4 style="color:var(--rd)">Really sure?</h4><p class="sub">Type <b>${n}</b> to confirm.</p><div class="flt"><input id="w2" inputmode="numeric" autocomplete="off" style="width:100%"></div><div class="act"><button class="btn c" style="--c:var(--rd)" id="w3" disabled>Continue</button><button class="btn" id="wx">Cancel</button></div>`);
  const i=p.q('#w2'),b=p.q('#w3');i.focus();i.oninput=()=>{b.disabled=i.value.trim()!==String(n)};p.q('#wx').onclick=p.close;b.onclick=()=>{p.close();setTimeout(step3,260)}}
 function step3(){p=pop(`<h4 style="color:var(--rd)">Last chance</h4><p class="sub">Press and hold for 3 seconds. Letting go cancels.</p><div class="act"><button class="btn c hold" style="--c:var(--rd)" id="w4"><span>Hold to delete</span></button><button class="btn" id="wx">Cancel</button></div>`);
  const h=p.q('#w4');let t0=0,raf=0;
  const run=now=>{const k=Math.min(1,(now-t0)/3000);h.style.setProperty('--p',k);if(k>=1){p.close();S.entries=[];S.lastBackup=0;save();msg='Everything deleted.';render(true);return}raf=requestAnimationFrame(run)};
  const up=()=>{cancelAnimationFrame(raf);h.style.setProperty('--p',0)};
  h.onpointerdown=e=>{e.preventDefault();t0=performance.now();raf=requestAnimationFrame(run)};h.oncontextmenu=e=>e.preventDefault();
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,up));p.q('#wx').onclick=p.close}}
function card(e,x='',nt0){return `<div class="e ${T[e.type][0]}"><div class="m">${tag(e)}<span>${fmt(e.ts)}</span>${e.type==='failure'&&e.status==='open'?`<span>${age(e)}</span>`:''}</div><p>${esc(e.note)}</p>${e.closeNote?`<p class="cn"><b>${e.closeType==='fixed'?'Fixed':'Moved on'}:</b> ${esc(e.closeNote)}</p>`:''}${e.type==='resistance'&&e.status==='through'?'<p class="cn">Went through</p>':''}${e.type==='resistance'&&e.status==='no'?'<p class="cn" style="border-color:var(--ln)">Did not go through</p>':''}${x}${nt0?'':`<div class="act tl">${jl(e)}<button class="lnk" data-edit="${e.id}">Edit</button><button class="lnk" data-del="${e.id}">Delete</button>${e.type==='failure'&&e.status==='closed'?`<button class="lnk" data-reopen="${e.id}">Reopen</button>`:''}</div>`}</div>`}
const jl=e=>(e.type==='resistance'&&e.status==='through')?'':`<button class="lnk" data-jar="${e.id}">${e.jar?'Remove from jar':'Add to cookie jar'}</button>`;const jb=()=>'';
const sec=(h,l,f)=>l.length?(h?`<h3>${h}</h3>`:'')+`<div class="grp">${l.map(f).join('')}</div>`:'';
const gb=(c,id,k,l)=>`<button class="btn c" style="--c:var(--${c})" data-${k}="${id}">${l}</button>`;

function noteList(){
 const a=nf?+new Date(nf+'T00:00:00'):0,b=nto?+new Date(nto+'T23:59:59'):Infinity,q=nq.trim().toLowerCase();
 const all=byNew(ofT(nt)).filter(e=>e.ts>=a&&e.ts<=b&&(!q||(e.note+' '+(e.closeNote||'')).toLowerCase().includes(q)));
 const op=all.filter(e=>e.status==='open'),dn=all.filter(e=>e.status!=='open');
 let h=`<p class="cntl">${all.length} ${all.length===1?'note':'notes'}</p>`;
 if(nt==='failure')h+=sec('Open',op,e=>card(e,`<div class="act">${gb('gr',e.id+'|fixed','close','Fixed')}${gb('gr',e.id+'|moved','close','Moved on')}${jb(e)}</div>`))+sec('Closed',dn,e=>card(e,`<div class="act">${jb(e)}</div>`));
 else if(nt==='resistance')h+=sec('Waiting on an outcome',op,e=>card(e,`<div class="act">${gb('gr',e.id+'|through','res','Went through')}<button class="btn" data-res="${e.id}|no">Didn't</button>${jb(e)}</div>`))+sec('Done',dn,e=>card(e,e.status==='through'?'':`<div class="act">${jb(e)}</div>`));
 else h+=sec('',all,e=>card(e,`<div class="act">${jb(e)}</div>`));
 return h+(all.length?'':'<div class="empty">Nothing here.</div>')}

function updHome(){const n=$('#pll');if(!n)return;n.textContent=rng(per)[2];const tot=per==='total';document.querySelectorAll('.nv').forEach(b=>{b.style.visibility=tot?'hidden':'visible';if(b.dataset.nav==='1')b.disabled=off>=0});['resistance','failure','restart'].forEach(t=>{$('#s-'+t).textContent=sub(t)});setNum()}
function bars(v,c,l0,l1){const n=v.length,m=Math.max(1,...v),w=300/n,bw=Math.min(w*.76,24);return `<svg viewBox="0 0 300 130" class="ch">${v.map((x,i)=>x?`<rect x="${(i*w+(w-bw)/2).toFixed(1)}" y="${(110-x/m*100).toFixed(1)}" width="${bw.toFixed(1)}" height="${(x/m*100).toFixed(1)}" style="fill:${c}"/>`:'').join('')}<path d="M0 110.5H300" style="stroke:var(--ln);fill:none"/><text x="0" y="125">${l0}</text><text x="300" y="125" text-anchor="end">${l1}</text><text x="300" y="9" text-anchor="end">max ${m}</text></svg>`}
function wkKey(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return+d}
const dur=ms=>ms<864e5?Math.max(1,Math.round(ms/36e5))+' h':(ms/864e5).toFixed(1)+' days';
function sRange(){const n=new Date();n.setHours(0,0,0,0);const end=+n+864e5,f=S.entries.length?Math.min(...S.entries.map(e=>e.ts)):end-864e5,fd=new Date(f);fd.setHours(0,0,0,0);let a,b=end;
 if(sf||st){a=sf?+new Date(sf+'T00:00:00'):+fd;if(st)b=Math.min(end,+new Date(st+'T00:00:00')+864e5)}else a=sr?end-sr*864e5:+fd;
 a=Math.max(a,+fd);if(b<=a)b=a+864e5;return[a,b]}
function statsBody(){
 const[a,b]=sRange(),inR=t=>t>=a&&t<b,days=[];
 for(let d=new Date(a);+d<b&&days.length<4000;d.setDate(d.getDate()+1))days.push({k:d.toDateString(),t:+d});
 const P=pushed().filter(inR),R=ofT('resistance').filter(e=>inR(e.ts)),F=ofT('failure').filter(e=>inR(e.ts)),RS=ofT('restart').filter(e=>inR(e.ts));
 const mp=new Map(days.map((d,i)=>[d.k,i])),dc=days.map(()=>0);P.forEach(t=>{const i=mp.get(new Date(t).toDateString());if(i!==undefined)dc[i]++});
 let v=dc;if(days.length>92){v=[];for(let i=0;i<dc.length;i+=7)v.push(dc.slice(i,i+7).reduce((x,y)=>x+y,0))}
 const wk=new Map();days.forEach((d,i)=>{const k=wkKey(d.t);wk.set(k,(wk.get(k)||0)+dc[i])});let bw=[0,0];wk.forEach((c,k)=>{if(c>bw[0])bw=[c,k]});
 const mx0=Math.max(...dc),bi=dc.indexOf(mx0),act=dc.filter(x=>x).length;
 const th=R.filter(e=>e.status==='through').length,no=R.filter(e=>e.status==='no').length,ro=R.length-th-no,dec=th+no;
 const cl=F.filter(e=>e.status==='closed'),fo=F.length-cl.length,avg=cl.length?cl.reduce((s,e)=>s+((e.closedTs||e.ts)-e.ts),0)/cl.length:0;
 const hrs=Array(24).fill(0);R.forEach(e=>{hrs[new Date(e.ts).getHours()]++});
 const hd=new Date();hd.setDate(1);hd.setHours(0,0,0,0);hd.setMonth(hd.getMonth()+hm);
 const dim=new Date(hd.getFullYear(),hd.getMonth()+1,0).getDate(),lead=(hd.getDay()+6)%7,mc=Array(dim).fill(0);
 pushed().forEach(t=>{const d=new Date(t);if(d.getFullYear()===hd.getFullYear()&&d.getMonth()===hd.getMonth())mc[d.getDate()-1]++});
 const mm=Math.max(1,...mc);
 const sbr=p=>p.reduce((s,x)=>s+x[0],0)?`<div class="sb">${p.map(x=>x[0]?`<i style="flex:${x[0]};background:${x[1]}"></i>`:'').join('')}</div><div class="lg">${p.map(x=>`<span><b style="color:${x[1]}">${x[0]}</b> ${x[2]}</span>`).join('')}</div>`:'<p class="empty" style="padding:8px 0 0">Nothing in this range.</p>';
 return `<p class="cntl" style="margin-left:0">${fmtD(a)} - ${fmtD(b-864e5)} · ${act} active ${act===1?'day':'days'} of ${days.length}</p>
 <div class="tiles"><div class="tile"><b>${P.length}</b><span>Pushed through</span></div><div class="tile R"><b>${R.length}</b><span>Resistance</span></div><div class="tile F"><b>${F.length}</b><span>Failures</span></div><div class="tile S"><b>${RS.length}</b><span>Restarts</span></div></div>
 <h3>Pushed through ${days.length>92?'per week':'per day'}</h3><div class="cp">${bars(v,'var(--hero)',fmtD(days[0].t),fmtD(days[days.length-1].t))}<div class="lg" style="margin-top:8px"><span>Best day <b style="color:var(--tx)">${mx0?mx0+' · '+fmtD(days[bi].t):'-'}</b></span><span>Best week <b style="color:var(--tx)">${bw[0]?bw[0]+' · week of '+fmtD(bw[1]):'-'}</b></span></div></div>
 <h3>Month view</h3><div class="cp"><div class="hmh"><button class="nv" data-hm="-1">‹</button><span>${hd.toLocaleDateString([],{month:'long',year:'numeric'})} · ${mc.filter(x=>x).length} active</span><button class="nv" data-hm="1" ${hm>=0?'disabled':''}>›</button></div><div class="hm">${'MTWTFSS'.split('').map(x=>`<i>${x}</i>`).join('')}${Array(lead).fill('<div class="hc n"></div>').join('')}${mc.map((c,i)=>{const al=c?+(.2+.7*c/mm).toFixed(2):0;return `<div class="hc" style="--a:${al};${al>.5?'color:#fff':''}">${i+1}</div>`}).join('')}</div></div>
 <h3>Resistance</h3><div class="cp"><div style="font-size:15px"><b>${dec?Math.round(th/dec*100)+'%':'-'}</b> went through</div>${sbr([[th,'var(--gr)','went through'],[no,'var(--mu)','did not'],[ro,'var(--or)','waiting']])}</div>
 <h3>Failures</h3><div class="cp"><div style="font-size:15px"><b>${F.length}</b> logged${cl.length?` · closes in about <b>${dur(avg)}</b>`:''}</div>${sbr([[cl.length,'var(--gr)','closed'],[fo,'var(--rd)','still open']])}</div>
 <h3>When resistance hits</h3><div class="cp">${bars(hrs,'var(--or)','12am','11pm')}</div>`}
const views={
stats(){const cu=sf||st;return `<h2>Stats</h2><div class="seg${cu?' cu':''}" style="--n:4;--i:${Math.max(0,[7,30,90,0].indexOf(sr))};max-width:none;margin:0 0 12px"><i></i>${[7,30,90,0].map(x=>`<button class="${x===sr&&!cu?'on':''}" data-sr="${x}">${x?x+' days':'All'}</button>`).join('')}</div><div class="flt"><div class="dts" style="margin:0"><label>From<input id="sf" type="date" value="${sf}"></label><label>To<input id="st" type="date" value="${st}"></label><button class="btn" data-sclr="1">Clear</button></div></div><div id="sv">${statsBody()}</div>`},
settings(){return `<h2>Settings</h2><h3>Your name</h3><div class="flt"><input id="sn" type="text" maxlength="30" value="${esc(S.name||'')}" placeholder="What should I call you?" style="width:100%"></div><div class="act"><button class="btn p" data-sn="1">Save name</button></div><p id="sm" style="color:var(--mu);font-size:14px">Shown in the welcome animation every time you open the app.</p>`+views.data()},
home(){
 const open=ofT('resistance').filter(e=>e.status==='open').length;
 const wk=S.entries.length&&Date.now()-S.lastBackup>6048e5&&Date.now()-S.hideBk>864e5;
 const P=['total','today','weekly','monthly'];
 return `<section class="home"><div class="t">Pushed Through</div>
 <div class="hero"><div class="num"><span id="n">${dg(shown)}</span><small>times</small></div><div class="pl" id="pl"><button class="nv" data-nav="-1" aria-label="Previous">‹</button><label class="plb"><span id="pll">${rng(per)[2]}</span><input type="date" id="dp" max="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}"></label><button class="nv" data-nav="1" aria-label="Next">›</button></div></div>
 <div class="seg" style="--n:4;--i:${P.indexOf(per)}"><i></i>${P.map(p=>`<button class="${p===per?'on':''}" data-per="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</div>
 <div class="subs">${[['resistance','Resistance','R'],['failure','Failures','F'],['restart','Restarts','S']].map(([t,l,c])=>`<div class="${c}"><b id="s-${t}">${sub(t)}</b>${l}</div>`).join('')}</div>
 <div class="adds">${[['resistance','Resistance','R','<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'],['failure','Failure','F','<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'],['restart','Restart','S','<path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/>']].map(([t,l,c,p])=>`<button class="add ${c}" data-add="${t}">${l}</button>`).join('')}</div>
 <p class="hint">${open?`<button data-go="notes" data-tab="resistance">${open} resistance waiting on an outcome</button>`:''}${open&&wk?' · ':''}${wk?`Backup is over a week old. <button data-go="settings">Back up</button> · <button data-hbk="1">dismiss</button>`:''}</p></section>`},
notes(){
 const N=['failure','restart','resistance'],L=['Failures','Restarts','Resistance'];
 return `<h2>Notes</h2><div class="seg" style="--n:3;--i:${N.indexOf(nt)};max-width:none;margin:0 0 14px"><i></i>${N.map((t,i)=>`<button class="${t===nt?'on':''}" data-nt="${t}">${L[i]}</button>`).join('')}</div>
 <div class="flt"><input id="nq" type="search" placeholder="Search notes" value="${esc(nq)}"><div class="dts"><label>From<input id="nf" type="date" value="${nf}"></label><label>To<input id="nto" type="date" value="${nto}"></label><button class="btn" data-clr="1">Clear</button></div></div>
 <div id="nl">${noteList()}</div>`},
jar(){
 const l=byNew(S.entries.filter(inJar));
 return `<h2>Cookie jar</h2><p style="color:var(--mu);margin:-8px 0 16px">Proof of what it took to get here.</p>${l.length?'<div class="act" style="margin:0 0 16px"><button class="btn p" data-cookie="1">Pull a cookie</button></div>':''}${l.length?`<div class="grp">${l.map(e=>card(e,e.jar?`<div class="act">${jb(e)}</div>`:'')).join('')}</div>`:'<div class="empty">Empty for now. Resistance you go through lands here on its own. Flag any note to add it.</div>'}`},
history(){
 const l=byNew(S.entries);
 return `<h2>History</h2>${l.length?`<div class="grp">${l.map(e=>card(e,inJar(e)&&!e.jar?'':`<div class="act">${jb(e)}</div>`)).join('')}</div>`:'<div class="empty">Nothing logged yet.</div>'}`},
data(){
 return `<h3 style="margin:32px 0 8px 2px">Backup and data</h3>
 <p style="color:var(--mu)">Saved in this browser only. Export a file to back up or move to another device.</p>
 <div class="act"><button class="btn p" data-x="exp">Export file</button><label class="btn" tabindex="0">Import file<input id="imp" type="file" accept=".json,application/json" hidden></label><button class="btn" data-x="txt" data-d="7">Copy text: 7 days</button><button class="btn" data-x="txt" data-d="30">30 days</button><button class="btn" data-x="txt" data-d="0">All</button></div>
 <p style="color:var(--mu);font-size:14px">${S.lastBackup?'Last export: '+fmt(S.lastBackup):'No export yet.'}</p>
 <p style="color:var(--bl);font-weight:600">${esc(msg)}</p><textarea id="cp" hidden readonly></textarea><div class="danger"><h3>Danger zone</h3><p style="color:var(--mu);margin:0 0 12px">Wipes every entry from this browser. Export first, there is no way back.</p><button class="btn c" style="--c:var(--rd)" data-wipe="1">Delete everything</button></div>`}
};

function render(anim){
 $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===scr));
 const v=$('#v');v.innerHTML=views[scr]();
 if(anim){v.classList.remove('in');void v.offsetWidth;v.classList.add('in')}
 if(scr==='home'){updHome();const dp=$('#dp');dp.onclick=()=>{try{dp.showPicker()}catch(e){}};dp.onchange=e=>{const v=e.target.value;if(!v)return;const t0=new Date();t0.setHours(0,0,0,0);per='today';off=Math.min(0,Math.round((new Date(v+'T00:00:00')-t0)/864e5));render()}}
 const f=$('#imp');if(f)f.onchange=imp;
 if(scr==='stats')['sf','st'].forEach(id=>{$('#'+id).oninput=()=>{sf=$('#sf').value;st=$('#st').value;const g=$('.seg'),cu=!!(sf||st);g.classList.toggle('cu',cu);g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',!cu&&+x.dataset.sr===sr));$('#sv').innerHTML=statsBody()}});
 if(scr==='notes')['nq','nf','nto'].forEach(id=>{$('#'+id).oninput=()=>{nq=$('#nq').value;nf=$('#nf').value;nto=$('#nto').value;$('#nl').innerHTML=noteList()}});
}
function fit(){const n=$('#n');if(!n)return;const d=String(n.textContent).length||1,nav=innerWidth>=900?0:64,room=innerHeight-nav-380;
 const s=Math.max(72,Math.min(innerHeight*.5,(room-40)/.9,(innerWidth-(innerWidth>=900?240:90))/(d*.62)));
 n.parentNode.style.fontSize=s+'px';n.parentNode.style.setProperty('--fs',s+'px')}
function setNum(){
 const n=$('#n'),to=cnt(pushed(),per);
 if(to>shown&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  const a=shown,t0=performance.now(),u=$('.num');u.classList.remove('pop');void u.offsetWidth;u.classList.add('pop');
  (function s(t){const k=Math.min(1,(t-t0)/650);shown=Math.round(a+(to-a)*(1-Math.pow(1-k,3)));const el=$('#n');if(!el)return;el.innerHTML=dg(shown);fit();if(k<1)requestAnimationFrame(s)})(t0);
 }else{shown=to;n.innerHTML=dg(to)}
 fit();
}
addEventListener('resize',fit);
function seg(b){const g=b.closest('.seg'),bs=[...g.querySelectorAll('button')];g.style.setProperty('--i',bs.indexOf(b));bs.forEach(x=>x.classList.toggle('on',x===b))}

function sheet(o){
 const m=$('#md');
 m.innerHTML=`<div class="ov"><div class="sheet ${o.c}"><h4>${o.title}</h4><p class="sub">${o.sub}</p><textarea id="nt" placeholder="${o.ph}" maxlength="1000"></textarea><div class="err" id="er"></div><div class="act" style="margin-top:0"><button class="btn p" id="ok">${o.btn}</button><button class="btn" id="no">Cancel</button></div></div></div>`;
 const ov=m.firstChild,t=$('#nt'),close=()=>{ov.classList.add('x');setTimeout(()=>{if(m.firstChild===ov)m.innerHTML=''},230)};
 t.focus();
 $('#no').onclick=close;
 ov.onclick=e=>{if(e.target===ov)close()};
 const go=()=>{const v=t.value.trim();if(!v){$('#er').textContent='Add a line first.';t.focus();return}o.ok(v);close();save();render();navigator.vibrate&&navigator.vibrate(15)};
 $('#ok').onclick=go;
 t.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))go();if(e.key==='Escape')close()};
}
const A={
 resistance:()=>sheet({c:'R',title:'Resistance',sub:'What is it telling you right now?',ph:"Don't feel like it...",btn:'Log it',ok:v=>S.entries.push({id:uid(),type:'resistance',ts:Date.now(),note:v,status:'open'})}),
 failure:()=>sheet({c:'F',title:'Failure',sub:'What failed?',ph:'Got the problem wrong because...',btn:'Log it',ok:v=>S.entries.push({id:uid(),type:'failure',ts:Date.now(),note:v,status:'open'})}),
 restart:()=>sheet({c:'S',title:'Restart',sub:'Why are you getting up again?',ph:'Back at it because...',btn:'Log restart',ok:v=>S.entries.push({id:uid(),type:'restart',ts:Date.now(),note:v})})
};
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||$('#md').firstChild)return;const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;const k={r:'resistance',f:'failure',s:'restart'}[e.key.toLowerCase()];if(k){e.preventDefault();A[k]()}});
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){if(d.tab)nt=d.tab;scr=d.go;render(true);scrollTo(0,0)}
 else if(d.per){per=d.per;off=0;seg(b);updHome()}
 else if(d.nav){off=Math.min(0,off+ +d.nav);updHome()}
 else if(d.add)A[d.add]();
 else if(d.nt){nt=d.nt;seg(b);$('#nl').innerHTML=noteList()}
 else if(d.clr){nq=nf=nto='';render()}
 else if(d.hbk){S.hideBk=Date.now();save();render()}
 else if(d.jar){const e=S.entries.find(x=>x.id===d.jar);e.jar=!e.jar;save();render()}
 else if(d.res){const[i,s]=d.res.split('|'),e=S.entries.find(x=>x.id===i);e.status=s;e.doneTs=Date.now();save();render()}
 else if(d.close){const[i,k]=d.close.split('|'),e=S.entries.find(x=>x.id===i);
  sheet({c:'S',title:k==='fixed'?'Fixed':'Moved on',sub:k==='fixed'?'What did you find, and what comes next?':'Why is there nothing to fix?',ph:k==='fixed'?'Found... next I will...':'Nothing to fix because...',btn:'Close failure',
  ok:v=>{e.status='closed';e.closeType=k;e.closeNote=v;e.closedTs=Date.now();S.entries.push({id:uid(),type:'restart',ts:Date.now(),note:v,fromFailure:e.id})}})}
 else if(d.edit)edit(d.edit);
 else if(d.del)askDel(d.del);
 else if(d.reopen)reopen(d.reopen);
 else if(d.sn){S.name=$('#sn').value.trim();save();$('#sm').textContent=S.name?'Saved. You will see it next time you open the app.':'Name cleared.'}
 else if(d.sr!==undefined){sr=+d.sr;sf=st='';$('#sf').value='';$('#st').value='';seg(b);b.closest('.seg').classList.remove('cu');$('#sv').innerHTML=statsBody()}
 else if(d.sclr){sf=st='';render()}
 else if(d.hm){hm=Math.min(0,hm+ +d.hm);$('#sv').innerHTML=statsBody()}
 else if(d.cookie)cookie();
 else if(d.wipe)wipe();
 else if(d.x==='exp')exportFile();
 else if(d.x==='txt')copyTxt(+d.d||0);
});
$('#nav').innerHTML='<div class="brand">Pushed Through</div>'+scr0.map(([k,l,p])=>`<button data-go="${k}">${ic(p)}<span>${l}</span></button>`).join('');

function plain(days){
 return byNew(S.entries).filter(e=>!days||e.ts>=Date.now()-days*864e5).map(e=>{
  const st=e.type==='resistance'?(e.status==='through'?'went through':e.status==='no'?'did not go through':'open'):e.type==='failure'?(e.status==='open'?'open':'closed ('+e.closeType+')'):(e.fromFailure?'from failure':'-');
  return `[${T[e.type][1]}] ${new Date(e.ts).toISOString().slice(0,16).replace('T',' ')} | ${st} | ${e.note.replace(/\n/g,' ')}${e.closeNote?' | closing note: '+e.closeNote.replace(/\n/g,' '):''}${e.jar?' | flagged jar':''}`}).join('\n')}
async function exportFile(){
 const data=JSON.stringify({app:'pushed-through',v:1,entries:S.entries},null,1),name='pushed-through-'+new Date().toISOString().slice(0,10)+'.json';
 try{
  const dl=window.claude&&await claude.use('downloads');
  if(dl)await dl.save({filename:name,data});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click()}
  S.lastBackup=Date.now();save();msg='Exported.';
 }catch(e){msg='Export cancelled or blocked.'}
 render();
}
function imp(ev){
 const f=ev.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{
  const j=JSON.parse(r.result),ids=new Set(S.entries.map(e=>e.id));let n=0;
  (j.entries||[]).forEach(e=>{if(e&&e.id&&T[e.type]&&typeof e.note==='string'&&!ids.has(e.id)){S.entries.push(e);n++}});
  save();msg='Imported '+n+' new entries. Export a fresh backup when you can.';
 }catch(e){msg='That file could not be read.'}
 shown=0;render()};
 r.readAsText(f);
}
async function copyTxt(days){
 const t=plain(days);let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
 msg=ok?'Copied. Paste it to Claude.':'Copy was blocked. Select the text below and copy it.';
 render();
 if(!ok){const c=$('#cp');c.hidden=false;c.value=t;c.style.minHeight='220px';c.select()}
}
render();
function welcome(){const o=$('#wb');if(o)o.remove();const d=document.createElement('div');d.id='wb';d.innerHTML=`<i></i><span>welcome back</span>${S.name?`<b>${esc(S.name)}</b>`:''}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
welcome();
{const q=new URLSearchParams(location.search).get('log');if(q&&A[q]){history.replaceState(null,'',location.pathname);setTimeout(()=>A[q](),2000)}}
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>60000)welcome()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
